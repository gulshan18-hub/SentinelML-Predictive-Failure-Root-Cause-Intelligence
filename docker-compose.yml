version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      APP_PORT: 8000
      APP_CORS_ORIGINS: http://localhost:5173
      MLFLOW_TRACKING_URI: file:./mlruns
    volumes:
      - ./backend:/app
      - ./artifacts:/artifacts
      - ./data:/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
